name: android-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate GeneralAMO regression contract
        run: python scripts/validate_mvp.py

      - name: Prepare fixed signing key
        run: |
          set -euo pipefail
          base64 -d ci/generalamo-candidate.keystore.b64 > ci/generalamo-candidate.keystore
          keytool -list -keystore ci/generalamo-candidate.keystore -storepass generalamo -alias generalamo >/dev/null

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK identity and version
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          VERSION="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' version.properties)"
          test -f "$APK"
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.desarrollamo.generalamo' versionCode='${VERSION_CODE}' versionName='${VERSION}'" /tmp/badging.txt
          jarsigner -verify -certs "$APK" >/dev/null

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GeneralAMO-${VERSION}.apk"
          sha256sum "dist/GeneralAMO-${VERSION}.apk" > dist/SHA256SUMS.txt
          echo "VERSION=${VERSION}"
          echo "PACKAGE=com.desarrollamo.generalamo"

      - uses: actions/upload-artifact@v6
        with:
          name: GeneralAMO-release
          path: dist/*

      - name: Publish stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          gh release create "v${VERSION}" dist/GeneralAMO-${VERSION}.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GeneralAMO ${VERSION}" \
            --notes "GeneralAMO 0.1.14: en Anotar partida ya no se escribe un puntaje libre. Al tocar cada casilla se abre un selector con únicamente los valores válidos para esa categoría, más Tachar, Borrar casilla y Cancelar. Escalera, Full y Póker respetan el bonus de servido configurado. Mantiene turnos, semáforo de anotaciones, totales, historial y juego por Wi-Fi/hotspot."
