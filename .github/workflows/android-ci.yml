name: android-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.7'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Canonical AutoCheck
        run: bash scripts/autocheck.sh

      - name: Prepare fixed signing key
        run: |
          set -euo pipefail
          base64 -d ci/generalamo-candidate.keystore.b64 > ci/generalamo-candidate.keystore
          keytool -list -keystore ci/generalamo-candidate.keystore -storepass generalamo -alias generalamo >/dev/null

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK identity and version
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          VERSION="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' version.properties)"
          test -f "$APK"
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.desarrollamo.generalamo' versionCode='${VERSION_CODE}' versionName='${VERSION}'" /tmp/badging.txt
          jarsigner -verify -certs "$APK" >/dev/null

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GeneralAMO-${VERSION}.apk"
          sha256sum "dist/GeneralAMO-${VERSION}.apk" > dist/SHA256SUMS.txt
          echo "VERSION=${VERSION}"
          echo "PACKAGE=com.desarrollamo.generalamo"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: GeneralAMO-release
          path: dist/*

      - name: Publish stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping duplicate publication."
            exit 0
          fi
          gh release create "$TAG" dist/GeneralAMO-${VERSION}.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GeneralAMO ${VERSION}" \
            --notes "GeneralAMO 0.1.16 agrega Ajustes con actualización directa independiente de StoreAMO. La app muestra su versión, consulta la última release oficial y permite descargar el APK desde GitHub con confirmación normal de Android. También aclara la compatibilidad: Android puede crear/compartir la mesa; iPhone/iPad pueden jugar, anotar o mirar desde Safari mediante el enlace Wi-Fi, aunque todavía no existe una app iOS instalable independiente."
