plugins {
    id 'com.android.application'
}

def versionProps = new Properties()
def versionFile = file('../version.properties')
if (!versionFile.exists()) {
    throw new GradleException('version.properties is required')
}
versionFile.withInputStream { versionProps.load(it) }

def appVersionName = versionProps.getProperty('VERSION_NAME')
def appVersionCode = versionProps.getProperty('VERSION_CODE')?.toInteger()
if (!appVersionName || appVersionCode == null) {
    throw new GradleException('VERSION_NAME and VERSION_CODE are required')
}

def signingStoreFile = System.getenv('GENERALAMO_KEYSTORE_PATH')
def signingStorePassword = System.getenv('GENERALAMO_STORE_PASSWORD')
def signingKeyAlias = System.getenv('GENERALAMO_KEY_ALIAS')
def signingKeyPassword = System.getenv('GENERALAMO_KEY_PASSWORD')
def releaseSigningRequired = (System.getenv('CI_RELEASE_SIGNING_REQUIRED') ?: 'false').toBoolean()
def hasReleaseSigning = [signingStoreFile, signingStorePassword, signingKeyAlias, signingKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.desarrollamo.generalamo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.desarrollamo.generalamo'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            create('secureRelease') {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.secureRelease
            } else if (releaseSigningRequired) {
                throw new GradleException('GeneralAMO release signing secrets are required; signing material must never be committed to Git')
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
